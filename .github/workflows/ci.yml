# Runs the test suite on every branch push and pull request, on Linux, macOS, and Windows.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: ${{ matrix.os }}, python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python --version
      - run: pip install -e ".[dev]"
      # The type check does not depend on the operating system, so run it once.
      - run: mypy
        if: matrix.os == 'ubuntu-latest'
      - run: pytest -q
