# Runs the test suite on every push and merge request.
# Needs a GitLab runner (shared runners on gitlab.com work; they may require account verification).
stages:
  - test

.pytest:
  stage: test
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    key: "pip-$CI_JOB_NAME"
    paths:
      - .cache/pip
  before_script:
    - python --version
    - pip install -e ".[dev]"
  script:
    - pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test:python3.11:
  extends: .pytest
  image: python:3.11

test:python3.12:
  extends: .pytest
  image: python:3.12
